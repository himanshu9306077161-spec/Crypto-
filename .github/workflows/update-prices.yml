name: Update Crypto Data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install libraries
        run: pip install requests

      - name: Run 20-Factor Analysis
        run: python fetch_data.py

      - name: Save results
        run: |
          git config user.email "bot@github.com"
          git config user.name "Crypto Bot"
          git add data/prices.json
          git diff --staged --quiet || git commit -m "auto: $(date +'%Y-%m-%d %H:%M IST')"
          git push
