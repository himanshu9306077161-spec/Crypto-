name: Update Crypto Data Daily

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install libraries
        run: pip install requests

      - name: Fetch all data
        run: python fetch_data.py

      - name: Save to repo
        run: |
          git config user.email "bot@github.com"
          git config user.name "Crypto Bot"
          git add data/
          git diff --staged --quiet || git commit -m "data: $(date +'%Y-%m-%d %H:%M IST')"
          git push
